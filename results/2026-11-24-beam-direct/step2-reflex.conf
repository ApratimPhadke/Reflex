# Reflex rig calibration: beam-direct rig (Pi 4 drives the servo itself, no microcontroller).
# Servo keys measured by "rxhw servo-cal 500 2500" on 2026-11-25 (results/2026-11-24-beam-direct/step2-*).
# level_us is PROVISIONAL (the servo centre): the MPU never reads 0 inside the limits, so the level is found
# with the ball in step 3. us_per_mrad: tilt slope at the MPU near the hinge, 1000-2000 us fit.
# Sensor keys (center_mm .. range_max_mm, sensor_dir, half_len_m) are PLACEHOLDERS until step 3.
# The previous rig (Black Pill I/O node) is in reflex.conf.blackpill-rig.
level_us      = 1504
us_per_mrad   = 8.7300
servo_dir     = -1
center_mm     = 120
sensor_dir    = 1
range_min_mm  = 40
range_max_mm  = 200
half_len_m    = 0.100
calibrated_at = 2026-11-25T00:30:00+05:30
board         = PI4_BEAM_DIRECT
servo_min_us  = 508
servo_max_us  = 2188
